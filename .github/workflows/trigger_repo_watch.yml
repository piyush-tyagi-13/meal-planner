name: Trigger repo-watch

# repo-watch's own schedule trigger has never fired (GitHub has never
# registered a cron for that repo), while this repo's daily cron has fired
# every day for weeks. So this workflow dispatches repo-watch on its behalf.
#
# GitHub's scheduler on this account runs 4-5 hours behind the cron time.
# Three entries cover the day; repo-watch's own gate decides which one
# actually sends (Monday, once past 09:30 UTC, then never again that week),
# so the extra dispatches cost a few seconds each and send nothing.
on:
  schedule:
    # GitHub's scheduler on this account runs hours late and drops occurrences
    # outright - on 2026-09-28 two of three fired, and the one that did landed
    # 32 min before repo-watch's 09:30 UTC floor, so nothing went out until it
    # was sent by hand. These entries are deliberately clustered so several
    # land in the 09:30-12:00 UTC window: whichever arrives first past the
    # floor sends, the rest hit the gate and exit in seconds. Redundancy is
    # the whole point - do not prune these back to one or two.
    - cron: '50 2 * * *'
    - cron: '20 4 * * *'
    - cron: '50 4 * * *'
    - cron: '30 5 * * *'
    - cron: '10 6 * * *'
    - cron: '50 6 * * *'
    - cron: '30 7 * * *'
    - cron: '0 9 * * *'    # late same-day safety net
    - cron: '0 11 * * *'   # last resort, still same day
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repo-watch (gated)
        env:
          GH_TOKEN: ${{ secrets.REPO_WATCH_TOKEN || secrets.GH_PAT }}
        run: |
          gh workflow run weekly_mailer.yml \
            --repo piyush-tyagi-13/repo-watch \
            -f reset_mode=none -f gated=true
          echo "dispatched repo-watch at $(date -u '+%Y-%m-%d %H:%M UTC')"
